<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>React Dynamic Controlled Application</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; }
    input { width: 100%; padding: 8px 12px; background: #334155; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
    .status { font-size: 12px; color: #38bdf8; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container" id="react-root">
    <h2>TechForward &bull; Frontend Engineer</h2>
    <div class="field">
      <label id="lbl-name">Candidate Name</label>
      <input type="text" id="react-candidate-name" aria-labelledby="lbl-name" data-controlled="true" />
      <div id="state-name-display" class="status">React State: empty</div>
    </div>

    <div class="field">
      <label id="lbl-email">Work Email</label>
      <input type="email" id="react-candidate-email" aria-labelledby="lbl-email" data-controlled="true" />
      <div id="state-email-display" class="status">React State: empty</div>
    </div>

    <div class="field">
      <label id="lbl-linkedin">LinkedIn URL</label>
      <input type="text" id="react-linkedin" aria-labelledby="lbl-linkedin" data-controlled="true" />
      <div id="state-linkedin-display" class="status">React State: empty</div>
    </div>

    <button type="submit" id="react-submit-btn" style="background:#0ea5e9; color:white; border:none; padding:10px 20px; border-radius:6px; cursor:pointer;">
      Apply Now
    </button>
  </div>

  <script>
    // Simulate React Synthetic event / controlled component behavior
    const state = { name: '', email: '', linkedin: '' };
    const nameInput = document.getElementById('react-candidate-name');
    const emailInput = document.getElementById('react-candidate-email');
    const linkedinInput = document.getElementById('react-linkedin');

    nameInput.addEventListener('input', (e) => {
      state.name = e.target.value;
      document.getElementById('state-name-display').innerText = 'React State: ' + state.name;
    });

    emailInput.addEventListener('input', (e) => {
      state.email = e.target.value;
      document.getElementById('state-email-display').innerText = 'React State: ' + state.email;
    });

    linkedinInput.addEventListener('input', (e) => {
      state.linkedin = e.target.value;
      document.getElementById('state-linkedin-display').innerText = 'React State: ' + state.linkedin;
    });
  </script>
</body>
</html>
